<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found – Dawikk Apps</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1a1816;
            color: #e6e6e6;
            text-align: center;
            padding: 20px;
        }

        .code {
            font-size: 5em;
            font-weight: 700;
            color: #81b64c;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.8em;
            color: #ffffff;
            margin: 0 0 15px;
        }

        p {
            color: #a8a29e;
            max-width: 520px;
            margin: 0 auto 25px;
            line-height: 1.6;
        }

        a.button {
            display: inline-block;
            background: #81b64c;
            color: #ffffff;
            padding: 14px 35px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
        }

        a.button:hover {
            background: #6fa03d;
        }

        .contact {
            margin-top: 30px;
            font-size: 0.95em;
            color: #a8a29e;
        }

        .contact a {
            color: #81b64c;
        }
    </style>
</head>
<body>
    <div>
        <div class="code">404</div>
        <h1>Page not found</h1>
        <p>The page you are looking for does not exist or has been moved.</p>
        <a class="button" href="/">Go to homepage</a>
        <p class="contact">Need help? Contact us at <a href="mailto:dawikk.apps@gmail.com">dawikk.apps@gmail.com</a></p>
    </div>
</body>
</html>
